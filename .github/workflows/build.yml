name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nvd-emu-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt_arch: win64_msvc2022_64
            label: Windows x64
            package: windows-x64
          - os: macos-14
            qt_arch: ""
            label: macOS Apple Silicon
            package: macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ runner.os == 'Windows' && 'windows' || 'mac' }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          archives: qtbase qtsvg
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --prefix dist
          $exe = Join-Path $PWD "dist/bin/nvd-emu.exe"
          if (!(Test-Path $exe)) { throw "Expected executable was not produced: $exe" }
          windeployqt --release --compiler-runtime --dir (Split-Path $exe) $exe
          Compress-Archive -Path "dist/bin/*" -DestinationPath "nvd-emu-windows-x64.zip" -Force

      - name: Package macOS Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --prefix dist
          APP_PATH="dist/nvd-emu.app"
          test -d "$APP_PATH"
          macdeployqt "$APP_PATH" -always-overwrite
          # Re-sign the fully assembled bundle so copied Qt frameworks and plugins
          # have a consistent signature. This is an ad-hoc signature, not Developer ID
          # signing or notarization; it prevents a malformed bundle signature but
          # does not eliminate Gatekeeper's unidentified-developer warning.
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" nvd-emu-macos-arm64.zip
          hdiutil create -volname "nvd-emu" -srcfolder "$APP_PATH" -ov -format UDZO nvd-emu-macos-arm64.dmg

      - name: Upload build package
        uses: actions/upload-artifact@v4
        with:
          name: nvd-emu-${{ matrix.package }}
          path: |
            nvd-emu-*.zip
            nvd-emu-*.dmg
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Nightly or Stable Release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: nvd-emu-*
          path: artifacts
          merge-multiple: true

      - name: Publish Nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nvd-emu Nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: artifacts/*
          body: |
            Automated nvd-emu development build from the latest commit on main.

            This is an early frontend milestone. It does not yet include a playable emulation core.

      - name: Publish Stable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: nvd-emu ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: artifacts/*
          body: |
            nvd-emu ${{ github.ref_name }} release.

            See the release notes and README for current implementation status.
