name: Validate nvd-emu Web

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate web frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate web app assets, manifest and inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path("docs/index.html").read_text(encoding="utf-8")
          manifest = json.loads(Path("docs/manifest.webmanifest").read_text(encoding="utf-8"))
          scripts = re.findall(r"<script(?![^>]*\bsrc=)(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit(f"Expected exactly one inline page script, found {len(scripts)}")
          if manifest.get("name") != "nvd-emu" or manifest.get("start_url") != "./":
              raise SystemExit("The PWA manifest is missing required nvd-emu fields")
          catalog = Path("docs/systems-data.js").read_text(encoding="utf-8")
          required_systems = ("atari2600", "atari7800", "a5200", "jaguar", "nes", "snes", "gba", "n64", "psx", "c64", "coleco", "ngp", "pcfx", "3do", "amiga", "dos", "pet", "plus4", "fds", "mame", "3ds", "gamecube", "neoGeo", "supergrafx", "cdi")
          for required in required_systems:
              if required not in catalog:
                  raise SystemExit(f"Missing configured emulator system: {required}")
          configured_systems = re.findall(r'^\s{4}(?:[A-Za-z0-9_]+|"[^"]+"):\{', catalog, flags=re.M)
          if len(configured_systems) < 40:
              raise SystemExit(f"Expected at least 40 system mappings, found {len(configured_systems)}")
          for page in ("library.html", "systems.html", "player.html", "settings.html", "emulator.html"):
              if not Path("docs", page).is_file():
                  raise SystemExit(f"Missing standalone page: docs/{page}")
          for asset in ("site.css", "systems-data.js", "artwork.js", "storage.js", "coi-bootstrap.js"):
              if not Path("docs", asset).is_file():
                  raise SystemExit(f"Missing shared asset: docs/{asset}")
          if 'coreChannel:"nightly"' not in catalog or 'threads:true' not in catalog or 'coreId:"azahar"' not in catalog:
              raise SystemExit("Experimental 3DS nightly core/threading configuration is missing")
          if 'window.EJS_threads=!!config.threads' not in html:
              raise SystemExit("The player is not passing the threading option to EmulatorJS")
          if 'coreId:"azahar"' not in catalog:
              raise SystemExit("The Nintendo 3DS profile must use EmulatorJS's canonical Azahar core ID")
          player_page = Path("docs/player.html").read_text(encoding="utf-8")
          emulator_page = Path("docs/emulator.html").read_text(encoding="utf-8")
          if "window.EJS_ready = function()" not in emulator_page or "window.EJS_onGameStart = function()" not in emulator_page:
              raise SystemExit("The emulator document must report EmulatorJS ready/game-start events")
          if 'report("isolation-error"' not in emulator_page:
              raise SystemExit("The emulator document must verify SharedArrayBuffer inside the threaded core context")
          if "core-timeout" not in player_page or not Path("docs/emulator.html").is_file():
              raise SystemExit("The dedicated emulator document and explicit startup-timeout reporting are required")
          storage = Path("docs/storage.js").read_text(encoding="utf-8")
          if "duplicateKey" not in storage or "alreadyExists" not in storage or "store.add(record)" not in storage:
              raise SystemExit("The browser library must detect and skip duplicate games")
          settings = Path("docs/settings.html").read_text(encoding="utf-8")
          if "+swSupported" in settings or "+swControls" in settings:
              raise SystemExit("Settings diagnostics cannot reference undefined service-worker variables")
          if "Cross-Origin-Embedder-Policy" not in Path("docs/sw.js").read_text(encoding="utf-8"):
              raise SystemExit("The cross-origin isolation service-worker shim is missing")
          artwork = Path("docs/artwork.js").read_text(encoding="utf-8")
          service_worker = Path("docs/sw.js").read_text(encoding="utf-8")
          if "fallbackLogoSvg" in artwork or "brandNames" in artwork:
              raise SystemExit("Fabricated/generated console-logo fallback code must not be present")
          boxart_code = artwork.split("function setBoxArt", 1)[1].split("window.NVD_ARTWORK", 1)[0]
          if "crossOrigin" in boxart_code:
              raise SystemExit("Game-cover images must not force CORS mode; some thumbnail hosts do not permit it")
          if "is3dsPlayerNavigation" not in service_worker or "nvd-emu-web-shell-v15" not in service_worker:
              raise SystemExit("Cross-origin isolation must be scoped to the 3DS player and use the refreshed cache version")
          if "coepCredentialless" in service_worker:
              raise SystemExit("Legacy global COEP state must not be used; it can break artwork on non-3DS pages")
          if "commons.wikimedia.org/wiki/Special:FilePath/" in artwork:
              raise SystemExit("Console logo requests must use direct image URLs rather than redirecting file pages")
          if artwork.count("https://upload.wikimedia.org/wikipedia/commons/") < 40:
              raise SystemExit("Expected at least 40 direct Wikimedia console-logo URLs")
          logo_mappings = re.findall(r'logoFile:', catalog)
          if len(logo_mappings) < 36:
              raise SystemExit(f"Expected at least 36 genuine platform-logo mappings, found {len(logo_mappings)}")
          if 'logoFile:"Virtualboy logo.svg"' not in catalog or 'logoFile:"Nintendo 3DS logo.svg"' not in catalog:
              raise SystemExit("Virtual Boy and Nintendo 3DS system logos must use actual logo assets")
          if "function renderSystemCatalog()" not in html:
              raise SystemExit("The dynamic system picker and compatibility list are missing")
          if "wasm-dolphin" not in html or "retail-disc library flow" not in html or "gamecube" not in catalog:
              raise SystemExit("GameCube WASM integration marker or system profile is missing")
          if "clearAllAppData" not in Path("docs/storage.js").read_text(encoding="utf-8"):
              raise SystemExit("Orphaned-storage recovery is missing")
          if not Path("docs/gamecube-bridge.js").is_file() or not Path(".github/workflows/sync-gamecube-engine.yml").is_file():
              raise SystemExit("GameCube bridge or pinned-runtime sync workflow is missing")
          if 'id="psx-bios-file"' not in html or 'window.EJS_biosUrl=config.biosUrl||""' not in html:
              raise SystemExit("Optional local PS1 BIOS support is missing")
          if 'pcsx_rearmed_pad1type":"dualshock"' not in html or 'pcsx_rearmed_analog_combo":"l1+r1+select"' not in html:
              raise SystemExit("PS1 DualShock analog defaults are missing")
          if "function stableGameID" not in html or "window.EJS_gameID=config.gameID" not in html:
              raise SystemExit("Per-game state identifiers are missing")
          if "EJS_Buttons" not in html or "gamepad:true" not in html:
              raise SystemExit("The emulator toolbar must expose controller settings")
          if "saveState:true" not in html or "loadState:true" not in html:
              raise SystemExit("Save/load state controls must be enabled")
          if "makeAtari2600TestCartridge" not in html:
              raise SystemExit("The built-in Atari 2600 diagnostic cartridge is missing")
          if not Path("index.html").exists() or "./docs/" not in Path("index.html").read_text(encoding="utf-8"):
              raise SystemExit("The root Pages entry must route visitors into the web application")
          Path("/tmp/nvd-emu-web-inline.js").write_text(scripts[0], encoding="utf-8")
          for page in ("docs/library.html", "docs/systems.html", "docs/player.html", "docs/settings.html", "docs/emulator.html"):
              source = Path(page).read_text(encoding="utf-8")
              inline = re.findall(r"<script(?![^>]*\bsrc=)(?:\s[^>]*)?>([\s\S]*?)</script>", source)
              for index, code in enumerate(inline):
                  Path(f"/tmp/nvd-emu-{Path(page).stem}-{index}.js").write_text(code, encoding="utf-8")
          print(f"Manifest, {len(configured_systems)} system mappings, five standalone pages, artwork and storage modules, duplicate-game checks, PS1 BIOS/DualShock options, save controls, Atari test and Pages root validated.")
          PY
          node --check /tmp/nvd-emu-web-inline.js
          for script in /tmp/nvd-emu-library-*.js /tmp/nvd-emu-systems-*.js /tmp/nvd-emu-player-*.js /tmp/nvd-emu-settings-*.js /tmp/nvd-emu-emulator-*.js; do
            test -f "$script" && node --check "$script"
          done
          for script in docs/systems-data.js docs/artwork.js docs/storage.js docs/sw.js docs/coi-bootstrap.js docs/gamecube-bridge.js; do node --check "$script"; done
          for logo in atari playstation sega nec commodore; do test -f "docs/assets/logos/$logo.svg"; done
          test -f docs/nvd-emu-logo.svg
          test -f docs/.nojekyll
          test ! -e CMakeLists.txt
          test ! -e .github/workflows/build.yml
